name: Relevé hebdomadaire RNM
on:
  schedule:
    # Tous les jours à 6 h UTC (18/10/2026) : le RNM publie une semaine avec quelques jours de retard
    # (le 18/10, la dernière en ligne était celle du 5 au 11 octobre). Passer chaque jour la récupère
    # au plus tard le lendemain de sa parution, au lieu d'attendre jusqu'à 3 jours (lundi/jeudi).
    - cron: '0 6 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  releve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node rnm.mjs
      - name: Publier si le relevé a changé
        run: |
          git config user.name "releve-rnm"
          git config user.email "actions@users.noreply.github.com"
          git add rnm.json
          git diff --cached --quiet -- rnm.json && echo "Rien de neuf" && exit 0
          git commit -m "Relevé RNM $(node -p "require('./rnm.json').date")"
          git push
